name: Cizgi Film Uret

on:
  workflow_dispatch:            # Actions sekmesinden elle "Run"
  repository_dispatch:          # Make / dış tetik: event_type = "uret"
    types: [uret]
  # schedule:                   # otomatik zamanlama (istersen aç)
  #   - cron: "0 18 * * *"      # her gün 18:00 UTC (21:00 TR)

jobs:
  uret:
    runs-on: ubuntu-latest      # CPU runner yeter; agir isi fal.ai (GPU) yapar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Bağımlılıklar
        run: pip install -r requirements.txt

      - name: Pipeline
        env:
          FAL_KEY:               ${{ secrets.FAL_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          YUKLE:                 ${{ vars.YUKLE }}
          YOUTUBE_CLIENT_ID:     ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # MODEL_SES / MODEL_GORSEL / MODEL_LIPSYNC / SES_ORNEGI istersen buraya vars olarak ekle
        run: python -m src.main

      - name: Videoyu artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: bolum
          path: cikti/bolum.mp4
          if-no-files-found: ignore

      - name: Kuyruğu geri commit'le
        run: |
          git config user.name  "cizgi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/fikirler.json
          git commit -m "durum: bolum islendi" || echo "degisiklik yok"
          git push || echo "push atlandi"
